# Push to main for a beta, tag v1.2.3 for a release. Everything else is inherited.
name: release

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  driver:
    uses: junohouse/driver-ci/.github/workflows/driver.yml@main
    # The publish job writes releases. A called workflow cannot request more permission
    # than its caller was granted, and this repo's default token is read-only.
    permissions:
      contents: write
    # Named rather than `inherit`. driver-ci lives in another organization, and `inherit`
    # would hand it every secret this repo has instead of the two it needs.
    secrets:
      CORE_TOKEN: ${{ secrets.CORE_TOKEN }}
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
