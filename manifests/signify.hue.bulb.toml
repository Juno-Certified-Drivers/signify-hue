[driver]
id = "signify.hue.bulb"
name = "Philips Hue Bulb"
manufacturer = "Signify"
version = "1.2.0"
runtime = "wasm"
# Bulbs live behind a bridge and inherit its address and key.
parent = "signify.hue.bridge"

[[proxy]]
id = 1
type = "light"
primary = true
capabilities = { dimmer = true, supports_ramp = true, ramp_rate_max_ms = 6553000, supports_color = true, supports_cct = true, cct_min = 2000, cct_max = 6500, min_on_level = 1 }

[[property]]
name = "Light id"
type = "string"
tooltip = "The bulb's resource id on the bridge"
