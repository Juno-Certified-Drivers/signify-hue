[driver]
id = "signify.hue.tap_dial"
name = "Philips Hue Tap Dial Switch"
manufacturer = "Signify"
version = "1.2.0"
runtime = "native"
parent = "signify.hue.bridge"

# Four buttons and a dial. The dial is a fifth binding rather than a property of the others, because
# the bridge publishes it as its own resource (`relative_rotary`) and because turning it is a
# different intention from pressing anything — a rule that brightens on rotation should not be woken
# by somebody pressing button 3.
#
# The buttons are numbered rather than named. Unlike a dimmer, nothing is printed on them: they are
# scene buttons and what they mean is whatever the house is set up to do with them.

# One binding for the whole remote, with the keys as parameters.
#
# A rule matches `pressed { key = 2, action = "held" }`, so "when the hall dimmer's brighter key
# is held" is expressible on one binding — which it was not before core's triggers could match
# parameters, and which is why this contract used to be one binding per key. A remote is one
# object somebody picks up; four bindings made it four tiles and four things to go offline
# separately.

[[proxy]]
id = 1
type = "keypad"
primary = true
capabilities = { key_count = 4, key_labels = "Button 1,Button 2,Button 3,Button 4", has_hold = true, has_repeat = true, has_double = true, has_triple = true, has_battery = true, is_rotary = true }

[[property]]
name = "Button 1 id"
type = "string"
tooltip = "Resource id of the first button"

[[property]]
name = "Button 2 id"
type = "string"
tooltip = "Resource id of the second button"

[[property]]
name = "Button 3 id"
type = "string"
tooltip = "Resource id of the third button"

[[property]]
name = "Button 4 id"
type = "string"
tooltip = "Resource id of the fourth button"

[[property]]
name = "Rotary id"
type = "string"
tooltip = "Resource id of the dial"

[[property]]
name = "Power id"
type = "string"
tooltip = "The battery service's resource id on the bridge"
